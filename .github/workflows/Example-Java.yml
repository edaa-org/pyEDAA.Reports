name: Example Java

on:
  workflow_call:

jobs:
  Java-Ant-JUnit4:
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: ✅ Run the Ant 'junit' target
        run: |
          cd examples/Java/JUnit
          ant -noinput -buildfile build-github.xml junit

      - name: List generated XML reports
        run: ls -lAh examples/Java/JUnit/build/*.xml

      - name: 📤 Upload JUnit XML files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Java-Ant-JUnit4
          path: examples/Java/JUnit/build/*.xml

  Java-Gradle-JUnit4:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: 🐘 Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: 'basic'

      - name: ✅ Run the Gradle 'test' task (and 'jacocoTestReport')
        run: |
          cd examples/Java/Gradle-JUnit4
          gradle test

      - name: List generated XML and CSV reports
        run: |
          ls -lAh examples/Java/Gradle-JUnit4/build/test-results/test/*.xml
          ls -lAh examples/Java/Gradle-JUnit4/build/reports/jacoco/test/jacocoTestReport.*

      - name: 📤 Upload JUnit XML files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Java-Gradle-JUnit4
          path: examples/Java/Gradle-JUnit4/build/test-results/test/*.xml

      - name: 📤 Upload JaCoCo XML and CSV files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Java-Gradle-JUnit4-JaCoCo
          path: examples/Java/Gradle-JUnit4/build/reports/jacoco/test/jacocoTestReport.*

  Java-Gradle-JUnit5:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: 🐘 Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: 'basic'

      - name: ✅ Run the Gradle 'test' task
        run: |
          cd examples/Java/Gradle-JUnit5
          gradle test

      - name: List generated XML reports
        run: ls -lAh examples/Java/Gradle-JUnit5/build/test-results/test/*.xml

      - name: 📤 Upload JUnit XML and Open Test Reporting XML files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Java-Gradle-JUnit5
          path: examples/Java/Gradle-JUnit5/build/test-results/test/*.xml

  Java-Gradle-JUnit6:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: 🐘 Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: 'basic'

      - name: ✅ Run the Gradle 'test' task
        run: |
          cd examples/Java/Gradle-JUnit6
          gradle test

      - name: List generated XML reports
        run: ls -lAh examples/Java/Gradle-JUnit6/build/test-results/test/*.xml

      - name: 📤 Upload JUnit XML and Open Test Reporting XML files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Java-Gradle-JUnit6
          path: examples/Java/Gradle-JUnit6/build/test-results/test/*.xml
