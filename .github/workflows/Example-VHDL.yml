name: Example VHDL

on:
  workflow_call:

jobs:
  VHDL-GHDL:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Install GHDL (mcode backend)
        uses: ghdl/setup-ghdl@v1
        with:
          backend: mcode

      - name: ✅ Simulate the testbench twice with statement coverage
        run: ./examples/VHDL/Counter/GHDL.sh

      - name: List generated reports
        run: ls -lAh examples/VHDL/Counter/*.json examples/VHDL/Counter/*.info

      - name: 📤 Upload code coverage files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: VHDL-GHDL
          path: |
            examples/VHDL/Counter/coverage-*.json
            examples/VHDL/Counter/coverage.info

  VHDL-NVC:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: 🔧 Install NVC
        uses: nickg/setup-nvc@v1

      - name: ✅ Simulate the testbench twice with statement and branch coverage
        run: ./examples/VHDL/Counter/NVC.sh

      - name: List generated reports
        run: ls -lAh examples/VHDL/Counter/cobertura.xml

      - name: 📤 Upload code coverage file as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: VHDL-NVC
          path: examples/VHDL/Counter/cobertura.xml
