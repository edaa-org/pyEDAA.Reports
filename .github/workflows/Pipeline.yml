name: Pipeline
run-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

on:
  push:
  workflow_dispatch:
  schedule:
# Every Friday at 22:00 - rerun pipeline to check for dependency-based issues
    - cron: '0 22 * * 5'

permissions:
  actions:  write
  contents: write
  pages:    write
  id-token: write

jobs:
  Prepare:
    uses: pyTooling/Actions/.github/workflows/PrepareJob.yml@r8

  ConfigParams:
    uses: pyTooling/Actions/.github/workflows/ExtractConfiguration.yml@r8

  Example-Java:
    uses: ./.github/workflows/Example-Java.yml

  Example-Cpp:
    uses: ./.github/workflows/Example-Cpp.yml

  Example-Python:
    uses: ./.github/workflows/Example-Python.yml

  Rust-Cargo:
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7
      - name: 🦀 Set up Rust 1.99.0 with LLVM tools
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - name: 🔧 Install cargo-nextest, cargo-llvm-cov and grcov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148,cargo-llvm-cov@0.9.1,grcov@0.10.7
      - name: ✅ Run unit and integration tests by cargo-nextest, instrumented for code coverage
        run: |
          cd examples/Rust/Cargo

          exitCode=0
          cargo llvm-cov nextest --locked --no-report --profile ci || exitCode=$?
          if [[ ${exitCode} -ne 100 ]]; then
            printf -- '::error title=%s::%s\n' "cargo-nextest" "Expected exit code 100 (failed tests), got ${exitCode}."
            exit 1
          fi

          mkdir -p reports
          cp target/nextest/ci/junit.xml reports/nextest-junit.xml
      - name: 📊 Write code coverage as LLVM JSON, lcov tracefile and Cobertura XML (cargo-llvm-cov)
        run: |
          cd examples/Rust/Cargo

          cargo llvm-cov report --json      --output-path reports/llvm-cov.json
          cargo llvm-cov report --lcov      --output-path reports/llvm-cov.info
          cargo llvm-cov report --cobertura --output-path reports/llvm-cov-cobertura.xml
      - name: 📊 Write code coverage as lcov tracefile, Cobertura XML and covdir JSON (grcov)
        run: |
          cd examples/Rust/Cargo

          # grcov reads the raw profiles of the test run, not the '.profdata' file merged by cargo-llvm-cov.
          for output in lcov:grcov.info cobertura-pretty:grcov-cobertura.xml covdir:grcov-covdir.json; do
            grcov target/llvm-cov-target/*.profraw --binary-path target/llvm-cov-target/debug/deps --source-dir . \
              --llvm --branch --ignore-not-existing --keep-only 'src/*' \
              --output-types "${output%%:*}" --output-path "reports/${output#*:}"
          done
      - name: List generated reports
        run: ls -lAh examples/Rust/Cargo/reports/
      - name: 📤 Upload JUnit XML and coverage files as artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: Rust-Cargo
          path: examples/Rust/Cargo/reports/*

  UnitTestingParams:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      package_namespace:   'pyEDAA'
      package_name:        'Reports'
      python_version_list: '3.11 3.12 3.13 3.14 pypy-3.11'
      disable_list:        'mingw64:* ubuntu:pypy-3.11 ubuntu-arm:pypy-3.11 windows:pypy-3.11 windows-arm:pypy-3.11'

  AppTestingParams:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: pyEDAA.Reports
      python_version_list: ""   # use latest Python version
      disable_list:        'mingw64:* ucrt64:*'

  UnitTesting:
    uses: pyTooling/Actions/.github/workflows/UnitTesting.yml@r8
    needs:
      - ConfigParams
      - UnitTestingParams
    with:
      jobs:                     ${{ needs.UnitTestingParams.outputs.python_jobs }}
      requirements:             '-r tests/unit/requirements.txt'
      pacboy:                   'msys/git python-jsonschema:p python-lxml:p'
      unittest_report_xml:      ${{ needs.ConfigParams.outputs.unittest_report_xml }}
      coverage_report_html:     ${{ needs.ConfigParams.outputs.coverage_report_html }}
      unittest_xml_artifact:    ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      coverage_sqlite_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_sqlite }}

  StaticTypeCheck:
    uses: pyTooling/Actions/.github/workflows/StaticTypeCheck.yml@r8
    needs:
      - ConfigParams
      - UnitTestingParams
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      html_report:    ${{ needs.ConfigParams.outputs.typing_report_html }}
      html_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).statictyping_html }}

  CodeQuality:
    uses: pyTooling/Actions/.github/workflows/CheckCodeQuality.yml@r8
    needs:
      - UnitTestingParams
    with:
      python_version:    ${{ needs.UnitTestingParams.outputs.python_version }}
      package_directory: ${{ needs.UnitTestingParams.outputs.package_directory }}
      bandit:            'true'
      pylint:            'false'
      artifact:          CodeQuality

  DocCoverage:
    uses: pyTooling/Actions/.github/workflows/CheckDocumentation.yml@r8
    needs:
      - UnitTestingParams
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      directory:      ${{ needs.UnitTestingParams.outputs.package_directory }}

  Package:
    uses: pyTooling/Actions/.github/workflows/Package.yml@r8
    needs:
      - UnitTestingParams
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      artifact:       ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}

  AppTesting:
    uses: pyTooling/Actions/.github/workflows/ApplicationTesting.yml@r8
    needs:
      - AppTestingParams
      - UnitTestingParams
      - Package
      - Example-Java
      - Example-Cpp
      - Example-Python
      - Rust-Cargo
    with:
      jobs:                 ${{ needs.AppTestingParams.outputs.python_jobs }}
      wheel:                ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
      apptest_xml_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).apptesting_xml }}

  PublishCoverageResults:
    uses: pyTooling/Actions/.github/workflows/PublishCoverageResults.yml@r8
    needs:
      - ConfigParams
      - UnitTestingParams
      - UnitTesting
    if: success() || failure()
    with:
      coverage_report_json:   ${{ needs.ConfigParams.outputs.coverage_report_json }}
      coverage_report_html:   ${{ needs.ConfigParams.outputs.coverage_report_html }}
      coverage_json_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}
      coverage_html_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}
      codecov:                'true'
      codacy:                 'true'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_TOKEN:  ${{ secrets.CODACY_TOKEN }}

  PublishTestResults:
    uses: pyTooling/Actions/.github/workflows/PublishTestResults.yml@r8
    needs:
      - ConfigParams
      - UnitTestingParams
      - UnitTesting
    if: success() || failure()
    with:
      testsuite-summary-name: ${{ needs.UnitTestingParams.outputs.package_fullname }}
      merged_junit_filename:  ${{ fromJson(needs.ConfigParams.outputs.unittest_merged_report_xml).filename }}
      merged_junit_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      dorny:                  'true'
      codecov:                'true'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  Documentation:
    uses: pyTooling/Actions/.github/workflows/SphinxDocumentation.yml@r8
    needs:
      - UnitTestingParams
      - ConfigParams
      - PublishTestResults
      - PublishCoverageResults
    with:
      python_version:         ${{ needs.UnitTestingParams.outputs.python_version }}
      coverage_report_json:   ${{ needs.ConfigParams.outputs.coverage_report_json }}
      unittest_xml_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      coverage_json_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}
      html_artifact:          ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_html }}
      latex_artifact:         ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_latex }}

  IntermediateCleanUp:
    uses: pyTooling/Actions/.github/workflows/IntermediateCleanUp.yml@r8
    needs:
      - UnitTestingParams
      - PublishCoverageResults
      - PublishTestResults
    with:
      sqlite_coverage_artifacts_prefix: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_sqlite }}-
      xml_unittest_artifacts_prefix:    ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}-

  PDFDocumentation:
    uses: pyTooling/Actions/.github/workflows/LaTeXDocumentation.yml@r8
    needs:
      - UnitTestingParams
      - Documentation
    with:
      document:       ${{ needs.UnitTestingParams.outputs.package_fullname }}
      latex_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_latex }}
      pdf_artifact:   ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_pdf }}
      can-fail:       'true'

  PublishToGitHubPages:
    uses: pyTooling/Actions/.github/workflows/PublishToGitHubPages.yml@r8
    needs:
      - Prepare
      - UnitTestingParams
      - Documentation
#      - PDFDocumentation
      - PublishCoverageResults
      - StaticTypeCheck
    if: needs.Prepare.outputs.publish_pages == 'true'
    with:
      doc:      ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_html }}
      coverage: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}
      typing:   ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).statictyping_html }}

  TriggerTaggedRelease:
    uses: pyTooling/Actions/.github/workflows/TagReleaseCommit.yml@r8
    needs:
      - Prepare
      - UnitTesting
#      - StaticTypeCheck
      - Package
      - AppTesting
      - PublishToGitHubPages
    if: >-
      ${{ !failure() && !cancelled()
       && needs.Prepare.outputs.is_release_commit == 'true'
       && github.event_name != 'schedule'
      }}
    permissions:
      contents: write  # required for create tag
      actions:  write  # required for trigger workflow
    with:
      version:  ${{ needs.Prepare.outputs.version }}
      auto_tag: ${{ needs.Prepare.outputs.is_release_commit }}
    secrets: inherit

  ReleasePage:
    uses: pyTooling/Actions/.github/workflows/PublishReleaseNotes.yml@r8
    needs:
      - Prepare
      - UnitTesting
#      - StaticTypeCheck
      - Package
      - AppTesting
      - PublishToGitHubPages
    if: >-
      ${{ !failure() && !cancelled()
       && needs.Prepare.outputs.is_release_tag == 'true'
      }}
    permissions:
      contents: write
      actions:  write
    with:
      tag: ${{ needs.Prepare.outputs.version }}
    secrets: inherit

  PublishOnPyPI:
    uses: pyTooling/Actions/.github/workflows/PublishOnPyPI.yml@r8
    needs:
      - UnitTestingParams
      - ReleasePage
    if: needs.Prepare.outputs.is_release_tag == 'true'
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      requirements:   '-r dist/requirements.txt'
      artifact:       ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
    secrets:
      PYPI_TOKEN:     ${{ secrets.PYPI_TOKEN }}

  ArtifactCleanUp:
    uses: pyTooling/Actions/.github/workflows/ArtifactCleanUp.yml@r8
    needs:
      - UnitTestingParams
      - UnitTesting
      - StaticTypeCheck
      - Documentation
#      - PDFDocumentation
      - PublishTestResults
      - PublishCoverageResults
      - PublishToGitHubPages
      - AppTesting
      - IntermediateCleanUp
    if: ${{ !cancelled() }}
    with:
      package: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
      remaining: |
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_html }}-*
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_xml }}-*
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}-*
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}-*
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_html }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_sqlite }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_xml }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).statictyping_html }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_html }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_latex }}
        ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).apptesting_xml }}-*
